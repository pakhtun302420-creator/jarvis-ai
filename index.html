<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS AI — IZHAR AFRIDI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010308; font-family: 'Segoe UI', Roboto, sans-serif; color: #00f3ff; }
        
        .app-container { display: flex; flex-direction: column; justify-content: space-between; height: 100vh; padding: 20px; text-align: center; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 12px; }
        .brand-title { font-size: 18px; font-weight: 800; letter-spacing: 3px; color: #00f3ff; text-shadow: 0 0 10px rgba(0,243,255,0.5); }
        .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; border: 1px solid #00f3ff; background: rgba(0,243,255,0.05); text-transform: uppercase; font-weight: bold; }
        .key-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; color: #00f3ff; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }

        .visualizer-section { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; cursor: pointer; }
        .orb {
            width: 190px; height: 190px; border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #00f3ff 40%, rgba(1,3,8,0.95) 100%);
            box-shadow: 0 0 35px rgba(0,243,255,0.5), inset 0 0 15px #ffffff;
            transition: all 0.4s ease-in-out;
        }

        .orb.dormant { transform: scale(0.88); opacity: 0.5; box-shadow: 0 0 15px rgba(0,243,255,0.2); }
        .orb.listening { animation: pulse-listening 1.2s infinite alternate ease-in-out; }
        .orb.thinking { animation: rotate-thinking 1s infinite linear; filter: hue-rotate(50deg); }
        .orb.speaking { animation: pulse-speaking 0.5s infinite alternate ease-in-out; box-shadow: 0 0 65px #00f3ff; }

        @keyframes pulse-listening { 0% { transform: scale(0.95); } 100% { transform: scale(1.08); } }
        @keyframes pulse-speaking { 0% { transform: scale(1); } 100% { transform: scale(1.18); } }
        @keyframes rotate-thinking { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .state-indicator { font-size: 13px; font-weight: 700; margin-top: 25px; letter-spacing: 2px; color: #88d6ec; }

        .transcript-container { background: rgba(0,243,255,0.03); border: 1px solid rgba(0,243,255,0.15); border-radius: 10px; padding: 12px; max-height: 130px; overflow-y: auto; text-align: left; font-size: 13px; line-height: 1.4; }
        .user-text { color: #a5f3fc; margin-bottom: 4px; }
        .jarvis-text { color: #00f3ff; font-weight: 600; }
        
        .footer-tag { font-size: 10px; letter-spacing: 1px; opacity: 0.6; border-top: 1px solid rgba(0,243,255,0.1); padding-top: 10px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(1,3,8,0.95); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-card { background: #060e1a; border: 1px solid #00f3ff; padding: 22px; border-radius: 12px; width: 90%; max-width: 350px; max-height: 85vh; overflow-y: auto; text-align: left; }
        .modal-card h3 { font-size: 15px; letter-spacing: 1px; margin-bottom: 6px; color: #00f3ff; }
        .modal-card p { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }
        .modal-card label { font-size: 10px; color: #00f3ff; font-weight: bold; margin-top: 6px; display: block; }
        .modal-card input { width: 100%; padding: 8px 10px; margin-top: 2px; margin-bottom: 8px; background: #010308; border: 1px solid rgba(0,243,255,0.3); color: #00f3ff; border-radius: 6px; outline: none; font-size: 11px; }
        .modal-card button { width: 100%; padding: 10px; background: #00f3ff; color: #010308; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 12px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <span class="status-badge" id="modeBadge">INITIALIZING...</span>
            <span class="brand-title">JARVIS</span>
            <button class="key-btn" id="openKeyModalBtn">🔑 API KEYS</button>
        </div>

        <div class="visualizer-section" id="startTouchArea">
            <div class="orb dormant" id="jarvisOrb"></div>
            <div class="state-indicator" id="stateLabel">TAP ORB TO START</div>
        </div>

        <div class="transcript-container">
            <div class="user-text" id="userSpeech">User: Say "Hello Jarvis"...</div>
            <div class="jarvis-text" id="jarvisSpeech">JARVIS: Standby mode active.</div>
        </div>

        <div class="footer-tag">DEVELOPED BY IZHAR AFRIDI</div>
    </div>

    <div id="keyModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>MULTI-API PROVIDERS</h3>
            <p>Save keys for 5 AI providers. System auto-rotates on quota exhaustion (429 Error):</p>
            
            <label>1. GOOGLE GEMINI API KEY</label>
            <input type="password" id="geminiKey" placeholder="Paste Gemini API Key" />
            
            <label>2. GROQ API KEY</label>
            <input type="password" id="groqKey" placeholder="Paste Groq API Key" />
            
            <label>3. OPENROUTER API KEY</label>
            <input type="password" id="openrouterKey" placeholder="Paste OpenRouter Key" />
            
            <label>4. TOGETHER AI KEY</label>
            <input type="password" id="togetherKey" placeholder="Paste Together AI Key" />
            
            <label>5. COHERE API KEY</label>
            <input type="password" id="cohereKey" placeholder="Paste Cohere API Key" />
            
            <button id="saveKeysBtn">SAVE API CONFIGURATION</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
